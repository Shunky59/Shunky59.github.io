<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK4S Pen Plotter Ultimate - Web</title>
    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --panel-bg: #ffffff;
            --border-color: #cccccc;
            --accent: #4CAF50;
            --accent-img: #2196F3;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden;
        }
        #left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        #toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }
        canvas {
            flex: 1;
            background-color: #e0e0e0;
            border: 1px solid #000;
            cursor: crosshair;
            border-radius: 5px;
        }
        #right-panel {
            width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 15px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .control-group {
            border: 1px solid var(--border-color);
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .control-group h3 {
            margin-top: 0;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            align-items: center;
            font-size: 14px;
        }
        input[type="text"], select {
            width: 120px;
            padding: 4px;
            box-sizing: border-box;
        }
        input[type="range"] {
            width: 120px;
        }
        input[type="checkbox"] {
            width: auto;
            margin-right: 100px;
        }
        button {
            background-color: #e0e0e0;
            border: 1px solid #999;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
        }
        button:hover { background-color: #d0d0d0; }
        .btn-primary { background-color: var(--accent); color: white; border: none; font-weight: bold; width: 100%; padding: 10px;}
        .btn-primary:hover { background-color: #45a049; }
        .btn-image { background-color: var(--accent-img); color: white; border: none; font-weight: bold; width: 100%; padding: 10px; margin-bottom: 5px;}
        .btn-image:hover { background-color: #1e88e5; }
        .btn-danger { color: red; width: 100%; margin-top: 5px;}
    </style>
</head>
<body>

<div id="left-panel">
    <div id="toolbar">
        <strong>Prusa MK4S Pen Plotter (Experimental)</strong>
        <div>
            <button onclick="resetView()">Reset View</button>
            <button onclick="zoomCanvas(0.8)">Zoom Out (-)</button>
            <button onclick="zoomCanvas(1.2)">Zoom In (+)</button>
        </div>
    </div>
    <div style="font-size: 12px; color: gray; margin-bottom: 5px;">Left-Click & Drag: Move/Resize | Right-Click & Drag: Pan</div>
    <canvas id="workspace"></canvas>
</div>

<div id="right-panel">
    <div class="control-group">
        <h3>Workspace Setup</h3>
        <div class="row">
            <label>Units:</label>
            <select id="unitSelect" onchange="changeUnits()">
                <option value="mm">Millimeters (mm)</option>
                <option value="cm">Centimeters (cm)</option>
                <option value="in">Inches (in)</option>
            </select>
        </div>
        <div class="row">
            <label>Show Prusa Bed:</label>
            <input type="checkbox" id="showPrusaBed" checked onchange="draw()">
        </div>
        <div class="row">
            <label>Preset:</label>
            <select id="paperPreset" onchange="applyPaperPreset()">
                <option value="letter">Letter (8.5x11 in)</option>
                <option value="a4">A4 (210x297 mm)</option>
                <option value="index">Index Card (3x5 in)</option>
                <option value="custom">Custom</option>
            </select>
        </div>
        <div class="row">
            <label>Width (<span class="unit-label">mm</span>):</label>
            <input type="text" id="paperW" onchange="applyCustomPaper()" placeholder="e.g. 8 1/2">
        </div>
        <div class="row">
            <label>Height (<span class="unit-label">mm</span>):</label>
            <input type="text" id="paperH" onchange="applyCustomPaper()" placeholder="e.g. 11">
        </div>
        <button onclick="toggleOrientation()" style="width: 100%; margin-top: 5px;">Toggle Portrait/Landscape</button>
    </div>

    <div class="control-group" style="background: #fafafa;">
        <div class="row" style="margin-bottom: 10px;">
            <label title="Lower = more detailed curves. Higher = faster loading.">Import Quality:</label>
            <select id="svgRes">
                <option value="0.5">Ultra (Very Slow)</option>
                <option value="1.0">High</option>
                <option value="2.5" selected>Standard (Fast)</option>
                <option value="5.0">Low (Fastest)</option>
            </select>
        </div>
        <input type="file" id="svgInput" accept=".svg" style="display: none;" onchange="handleSvgUpload(event)">
        <button onclick="document.getElementById('svgInput').click()" style="width: 100%; margin-bottom: 8px; padding: 10px; font-weight: bold;">Load Vector (SVG)</button>
        
        <input type="file" id="imgInput" accept="image/png, image/jpeg" style="display: none;" onchange="handleImageUpload(event)">
        <button class="btn-image" onclick="document.getElementById('imgInput').click()">Load Image (PNG/JPG)</button>
    </div>

    <div class="control-group" id="imgControls" style="display: none; background: #e3f2fd; border-color: #90caf9;">
        <h3>Image Tracing Settings</h3>
        <div class="row">
            <label title="Higher = strictly follows pixels. Lower = smooth curves.">Trace Detail:</label>
            <input type="range" id="traceDetail" min="1" max="100" value="95" onchange="runImageTracer()">
        </div>
        <div class="row">
            <label title="Ignores small clusters of pixels.">Noise Filter:</label>
            <input type="range" id="traceNoise" min="0" max="50" value="8" onchange="runImageTracer()">
        </div>
        <div class="row">
            <label title="Forces near-90-degree corners to be sharp. Great for logos and text.">Sharp Corners:</label>
            <input type="checkbox" id="traceCorners" checked onchange="runImageTracer()">
        </div>
        <div class="row">
            <label title="Keeps or removes the outer bounding box of the image.">Draw Border:</label>
            <input type="checkbox" id="traceBorder" checked onchange="runImageTracer()">
        </div>
        <div style="font-size: 10px; color: #555; text-align: center; margin-top: 5px;">Changes apply automatically</div>
    </div>

    <div class="control-group">
        <h3>Selected Object Tools</h3>
        <div class="row"><label>Width (<span class="unit-label">mm</span>):</label><input type="text" id="svgW" onchange="applyTransform()"></div>
        <div class="row"><label>Height (<span class="unit-label">mm</span>):</label><input type="text" id="svgH" onchange="applyTransform()"></div>
        <div class="row"><label>Rotation (°):</label><input type="text" id="svgRot" onchange="applyTransform()"></div>
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <button onclick="rotateSVG(-90)" style="flex: 1">-90°</button>
            <button onclick="rotateSVG(90)" style="flex: 1">+90°</button>
        </div>
        <div style="display: flex; gap: 5px;">
            <button onclick="centerSVG('x')" style="flex: 1">Center X</button>
            <button onclick="centerSVG('y')" style="flex: 1">Center Y</button>
        </div>
        <button class="btn-danger" onclick="deleteSVG()">Delete Selected</button>
    </div>

    <div class="control-group">
        <h3>Printer Hardware</h3>
        <div class="row"><label>Pen Offset X (<span class="unit-label">mm</span>):</label><input type="text" id="offX" onchange="applyHardware()"></div>
        <div class="row"><label>Pen Offset Y (<span class="unit-label">mm</span>):</label><input type="text" id="offY" onchange="applyHardware()"></div>
        <div class="row"><label>Pen Extension (<span class="unit-label">mm</span>):</label><input type="text" id="zCal" onchange="applyHardware()"></div>
        <div class="row"><label>Z Pressure (<span class="unit-label">mm</span>):</label><input type="text" id="zPres" onchange="applyHardware()"></div>
    </div>

    <button class="btn-primary" onclick="generateGCode()">Generate G-Code</button>
</div>

<svg id="svgParser" style="position: absolute; z-index: -100; opacity: 0; pointer-events: none;"></svg>

<script>
    // --- State Variables ---
    const canvas = document.getElementById('workspace');
    const ctx = canvas.getContext('2d');
    
    const BED_W = 250.0;
    const BED_H = 210.0;
    
    let viewZoom = 2.5;
    let viewPanX = 20.0;
    let viewPanY = 20.0;
    
    let currentUnit = 'mm';
    let paper = { x: 0, y: 0, w: 215.9, h: 279.4, portrait: true };
    let hw = { offX: -35.0, offY: 20.0, zCal: 4.0, zPres: 1.0 }; 
    let svgs = [];
    let selectedSvg = null;
    
    let isDragging = false;
    let dragType = null;
    let isPanning = false;
    let startX, startY, startMx, startMy, startSvgW, startSvgH;

    // Image Tracing States
    let lastRasterImage = null;
    let lastTracedSvg = null;
    
    // --- Resize Canvas ---
    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight - 40;
        draw();
    }
    window.addEventListener('resize', resizeCanvas);

    // --- Math & Fraction Parsing ---
    function parseFraction(str) {
        if (!str) return NaN;
        str = str.toString().trim();
        let parts = str.split(' ');
        if (parts.length === 2 && parts[1].includes('/')) {
            let whole = parseFloat(parts[0]);
            let frac = parts[1].split('/');
            let val = parseFloat(frac[0]) / parseFloat(frac[1]);
            return whole < 0 ? whole - val : whole + val;
        } else if (str.includes('/')) {
            let frac = str.split('/');
            return parseFloat(frac[0]) / parseFloat(frac[1]);
        }
        return parseFloat(str);
    }

    function toMM(val) {
        if(currentUnit === 'in') return val * 25.4;
        if(currentUnit === 'cm') return val * 10.0;
        return val;
    }

    function fromMM(val) {
        if(currentUnit === 'in') return val / 25.4;
        if(currentUnit === 'cm') return val / 10.0;
        return val;
    }

    function changeUnits() {
        currentUnit = document.getElementById('unitSelect').value;
        let labels = document.querySelectorAll('.unit-label');
        labels.forEach(l => l.innerText = currentUnit === 'in' ? 'in' : currentUnit);
        updateUI();
    }

    function toScreen(rx, ry) {
        return { x: (rx + viewPanX) * viewZoom, y: (BED_H - ry + viewPanY) * viewZoom };
    }

    function toReal(sx, sy) {
        return { x: (sx / viewZoom) - viewPanX, y: BED_H - (sy / viewZoom) + viewPanY };
    }

    function rotatePoint(x, y, cx, cy, angleDeg) {
        let rad = angleDeg * Math.PI / 180;
        return {
            x: cx + (x - cx) * Math.cos(rad) - (y - cy) * Math.sin(rad),
            y: cy + (x - cx) * Math.sin(rad) + (y - cy) * Math.cos(rad)
        };
    }

    // --- Drawing System ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let showPrusaBed = document.getElementById('showPrusaBed').checked;
        
        let print1 = toScreen(0, BED_H), print2 = toScreen(BED_W, 0);

        if (showPrusaBed) {
            // 1) Draw the oversized physical steel sheet
            let sheet1 = toScreen(-8, 225); // Gives 8-15mm margin around the printable area
            let sheet2 = toScreen(258, -15);
            ctx.fillStyle = "#8a948c"; // PEI sheet green-grey
            ctx.fillRect(sheet1.x, sheet1.y, sheet2.x - sheet1.x, sheet2.y - sheet1.y);
            
            ctx.strokeStyle = "#555555";
            ctx.lineWidth = 1;
            ctx.strokeRect(sheet1.x, sheet1.y, sheet2.x - sheet1.x, sheet2.y - sheet1.y);

            // 2) Draw the 50mm Painted Grid
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; 
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            // Vertical grid lines (X=0 to 250), they stop at Y=200
            for (let i = 0; i <= 250; i += 50) {
                let p1 = toScreen(i, 0), p2 = toScreen(i, 200);
                ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            }
            // Horizontal grid lines (Y=0 to 200), spanning full X=250 width
            for (let i = 0; i <= 200; i += 50) {
                let p1 = toScreen(0, i), p2 = toScreen(250, i);
                ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            }
            ctx.stroke();
            
            // 3) Draw the Solid White Printable Area Border (0 to 250, 0 to 210)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
            ctx.lineWidth = 2;
            ctx.strokeRect(print1.x, print1.y, print2.x - print1.x, print2.y - print1.y);

            // Print area text markers
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "right";
            ctx.fillText("ORIGINAL PRUSA", print2.x - 10, print2.y - 15);
            ctx.textAlign = "left";
            ctx.fillText("L Print area", print1.x + 10, print1.y - 10);

        } else {
            // Draw Default Standard Grid strictly inside 250x210
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
            for (let i = 0; i <= BED_W; i += 10) {
                let p1 = toScreen(i, 0), p2 = toScreen(i, BED_H);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }
            for (let i = 0; i <= BED_H; i += 10) {
                let p1 = toScreen(0, i), p2 = toScreen(BED_W, i);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }
            // Outline
            ctx.strokeStyle = "#444"; ctx.lineWidth = 2;
            ctx.strokeRect(print1.x, print1.y, print2.x - print1.x, print2.y - print1.y);
        }

        // Draw Hardware Printable Area (Safe Zone based on RIGHT offsets)
        let safeMinX = Math.max(0, hw.offX); 
        let safeMaxX = Math.min(BED_W, BED_W + hw.offX); 
        let safeMinY = Math.max(0, -hw.offY);  
        let safeMaxY = Math.min(BED_H, BED_H - hw.offY); 
        
        if (safeMaxX > safeMinX && safeMaxY > safeMinY) {
            let sP1 = toScreen(safeMinX, safeMaxY);
            let sP2 = toScreen(safeMaxX, safeMinY);
            
            ctx.strokeStyle = "rgba(255, 0, 0, 0.4)";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.strokeRect(sP1.x, sP1.y, sP2.x - sP1.x, sP2.y - sP1.y);
            ctx.setLineDash([]);
            
            ctx.fillStyle = "rgba(255, 0, 0, 0.5)";
            ctx.font = "14px Arial";
            ctx.fillText("Printable Area (Offset Applied)", sP1.x + 5, sP1.y + 18);
        }

        // Draw Paper
        let p1 = toScreen(paper.x, paper.y + paper.h), p2 = toScreen(paper.x + paper.w, paper.y);
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)"; ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
        ctx.strokeStyle = "#999"; ctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);

        // Draw SVG Objects
        svgs.forEach((svg) => {
            let cx = svg.x + svg.w / 2; let cy = svg.y + svg.h / 2;
            let handles = [
                {x: svg.x, y: svg.y + svg.h}, {x: svg.x + svg.w, y: svg.y + svg.h}, {x: svg.x + svg.w, y: svg.y}, {x: svg.x, y: svg.y},
                {x: svg.x + svg.w / 2, y: svg.y + svg.h}, {x: svg.x + svg.w, y: svg.y + svg.h / 2}, {x: svg.x + svg.w / 2, y: svg.y}, {x: svg.x, y: svg.y + svg.h / 2}
            ];

            let rotatedHandles = handles.map(h => rotatePoint(h.x, h.y, cx, cy, -svg.rot));
            let isSelected = (svg === selectedSvg);

            ctx.strokeStyle = isSelected ? "#00cc00" : "#0066cc";
            ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath();
            let c0 = toScreen(rotatedHandles[0].x, rotatedHandles[0].y);
            ctx.moveTo(c0.x, c0.y);
            for(let i=1; i<4; i++) {
                let p = toScreen(rotatedHandles[i].x, rotatedHandles[i].y);
                ctx.lineTo(p.x, p.y);
            }
            ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);

            ctx.strokeStyle = isSelected ? "#00cc00" : "#000000";
            ctx.lineWidth = 1.5;
            let scaleX = svg.w / svg.origW; let scaleY = svg.h / svg.origH;

            svg.paths.forEach(path => {
                ctx.beginPath();
                path.points.forEach((pt, i) => {
                    let inkX = svg.x + ((pt.x - svg.rawXmin) * scaleX);
                    let inkY = svg.y + svg.h - ((pt.y - svg.rawYmin) * scaleY);
                    let rotPt = rotatePoint(inkX, inkY, cx, cy, -svg.rot);
                    let screenPt = toScreen(rotPt.x, rotPt.y);
                    
                    if(i === 0) ctx.moveTo(screenPt.x, screenPt.y);
                    else ctx.lineTo(screenPt.x, screenPt.y);
                });
                ctx.stroke();
            });

            if(isSelected) {
                rotatedHandles.forEach((rh) => {
                    let sp = toScreen(rh.x, rh.y);
                    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#e60000"; ctx.lineWidth = 2;
                    ctx.fillRect(sp.x - 4, sp.y - 4, 8, 8); ctx.strokeRect(sp.x - 4, sp.y - 4, 8, 8);
                });
            }
        });
    }

    // --- Interaction Physics ---
    canvas.addEventListener('mousedown', e => {
        if(e.button === 2 || e.button === 1) { 
            isPanning = true; startX = e.clientX; startY = e.clientY; return;
        }

        let rect = canvas.getBoundingClientRect();
        let realPt = toReal(e.clientX - rect.left, e.clientY - rect.top);

        if(selectedSvg) {
            let cx = selectedSvg.x + selectedSvg.w / 2; let cy = selectedSvg.y + selectedSvg.h / 2;
            let handles = [
                {x: selectedSvg.x, y: selectedSvg.y + selectedSvg.h}, {x: selectedSvg.x + selectedSvg.w, y: selectedSvg.y + selectedSvg.h},
                {x: selectedSvg.x + selectedSvg.w, y: selectedSvg.y}, {x: selectedSvg.x, y: selectedSvg.y},
                {x: selectedSvg.x + selectedSvg.w / 2, y: selectedSvg.y + selectedSvg.h}, {x: selectedSvg.x + selectedSvg.w, y: selectedSvg.y + selectedSvg.h / 2},
                {x: selectedSvg.x + selectedSvg.w / 2, y: selectedSvg.y}, {x: selectedSvg.x, y: selectedSvg.y + selectedSvg.h / 2}
            ];

            for(let i=0; i<8; i++) {
                let rh = rotatePoint(handles[i].x, handles[i].y, cx, cy, -selectedSvg.rot);
                let sp = toScreen(rh.x, rh.y);
                if(Math.abs((e.clientX - rect.left) - sp.x) <= 6 && Math.abs((e.clientY - rect.top) - sp.y) <= 6) {
                    isDragging = true; dragType = 'handle_' + i;
                    startSvgW = selectedSvg.w; startSvgH = selectedSvg.h;
                    startMx = realPt.x; startMy = realPt.y; return;
                }
            }
        }

        for(let i = svgs.length - 1; i >= 0; i--) {
            let svg = svgs[i];
            let cx = svg.x + svg.w / 2; let cy = svg.y + svg.h / 2;
            let unRotPt = rotatePoint(realPt.x, realPt.y, cx, cy, svg.rot);
            
            if(unRotPt.x >= svg.x && unRotPt.x <= svg.x + svg.w && unRotPt.y >= svg.y && unRotPt.y <= svg.y + svg.h) {
                selectedSvg = svg; isDragging = true; dragType = 'svg';
                startMx = realPt.x - svg.x; startMy = realPt.y - svg.y;
                updateUI(); draw(); return;
            }
        }

        if(realPt.x >= paper.x && realPt.x <= paper.x + paper.w && realPt.y >= paper.y && realPt.y <= paper.y + paper.h) {
            selectedSvg = null; isDragging = true; dragType = 'paper';
            startMx = realPt.x - paper.x; startMy = realPt.y - paper.y;
            updateUI(); draw(); return;
        }

        selectedSvg = null; updateUI(); draw();
    });

    canvas.addEventListener('mousemove', e => {
        if(isPanning) {
            viewPanX += (e.clientX - startX) / viewZoom; viewPanY += (e.clientY - startY) / viewZoom;
            startX = e.clientX; startY = e.clientY; draw(); return;
        }

        if(!isDragging) return;

        let rect = canvas.getBoundingClientRect();
        let realPt = toReal(e.clientX - rect.left, e.clientY - rect.top);

        if(dragType.startsWith('handle_')) {
            let idx = parseInt(dragType.split('_')[1]);
            let svg = selectedSvg; let cx = svg.x + svg.w / 2; let cy = svg.y + svg.h / 2;
            let urPt = rotatePoint(realPt.x, realPt.y, cx, cy, svg.rot);
            let newW = svg.w, newH = svg.h;

            if(idx <= 3) { 
                let scale = Math.hypot(urPt.x - cx, urPt.y - cy) / Math.hypot(startSvgW/2, startSvgH/2);
                newW = startSvgW * scale; newH = startSvgH * scale;
            } else if(idx === 4 || idx === 6) { newH = 2 * Math.abs(urPt.y - cy);
            } else if(idx === 5 || idx === 7) { newW = 2 * Math.abs(urPt.x - cx); }

            if(newW > 1 && newH > 1) {
                svg.w = newW; svg.h = newH; svg.x = cx - newW / 2; svg.y = cy - newH / 2; updateUI();
            }
        } else if(dragType === 'svg') {
            selectedSvg.x = realPt.x - startMx; selectedSvg.y = realPt.y - startMy;
        } else if(dragType === 'paper') {
            paper.x = realPt.x - startMx; paper.y = realPt.y - startMy;
        }
        draw();
    });

    window.addEventListener('mouseup', () => { isDragging = false; isPanning = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // --- UI Logic ---
    function resetView() { viewZoom = 2.5; viewPanX = 20.0; viewPanY = 20.0; draw(); }
    function zoomCanvas(factor) { viewZoom *= factor; draw(); }
    
    function applyPaperPreset() {
        let val = document.getElementById('paperPreset').value;
        if(val === 'letter') { paper.w = 215.9; paper.h = 279.4; }
        else if(val === 'a4') { paper.w = 210.0; paper.h = 297.0; }
        else if(val === 'index') { paper.w = 76.2; paper.h = 127.0; }
        
        if(val !== 'custom') {
            if(!paper.portrait) { let t = paper.w; paper.w = paper.h; paper.h = t; }
            updateUI(); draw();
        }
    }

    function applyCustomPaper() {
        document.getElementById('paperPreset').value = 'custom';
        let customW = parseFraction(document.getElementById('paperW').value);
        let customH = parseFraction(document.getElementById('paperH').value);
        
        if(!isNaN(customW)) paper.w = toMM(customW);
        if(!isNaN(customH)) paper.h = toMM(customH);
        updateUI(); draw();
    }
    
    function toggleOrientation() {
        paper.portrait = !paper.portrait;
        let t = paper.w; paper.w = paper.h; paper.h = t;
        
        if(document.getElementById('paperPreset').value !== 'custom') {
             updateUI();
        } else {
             let pw = document.getElementById('paperW').value;
             let ph = document.getElementById('paperH').value;
             document.getElementById('paperW').value = ph;
             document.getElementById('paperH').value = pw;
        }
        draw();
    }

    function applyHardware() {
        let ox = parseFraction(document.getElementById('offX').value);
        let oy = parseFraction(document.getElementById('offY').value);
        let zc = parseFraction(document.getElementById('zCal').value);
        let zp = parseFraction(document.getElementById('zPres').value);
        
        if(!isNaN(ox)) hw.offX = toMM(ox);
        if(!isNaN(oy)) hw.offY = toMM(oy);
        if(!isNaN(zc)) hw.zCal = toMM(zc);
        if(!isNaN(zp)) hw.zPres = toMM(zp);
        updateUI();
        draw();
    }

    function updateUI() {
        document.getElementById('paperW').value = fromMM(paper.w).toFixed(3);
        document.getElementById('paperH').value = fromMM(paper.h).toFixed(3);
        
        document.getElementById('offX').value = fromMM(hw.offX).toFixed(3);
        document.getElementById('offY').value = fromMM(hw.offY).toFixed(3);
        document.getElementById('zCal').value = fromMM(hw.zCal).toFixed(3);
        document.getElementById('zPres').value = fromMM(hw.zPres).toFixed(3);

        if(selectedSvg) {
            document.getElementById('svgW').value = fromMM(selectedSvg.w).toFixed(3);
            document.getElementById('svgH').value = fromMM(selectedSvg.h).toFixed(3);
            document.getElementById('svgRot').value = selectedSvg.rot.toFixed(2);
        } else {
            document.getElementById('svgW').value = ""; document.getElementById('svgH').value = ""; document.getElementById('svgRot').value = "";
        }
    }

    function applyTransform() {
        if(!selectedSvg) return;
        let nw = parseFraction(document.getElementById('svgW').value);
        let nh = parseFraction(document.getElementById('svgH').value);
        
        if(!isNaN(nw)) selectedSvg.w = toMM(nw);
        if(!isNaN(nh)) selectedSvg.h = toMM(nh);
        
        let rot = parseFraction(document.getElementById('svgRot').value);
        if(!isNaN(rot)) selectedSvg.rot = rot;
        
        updateUI(); draw();
    }

    function rotateSVG(deg) {
        if(!selectedSvg) return;
        selectedSvg.rot = (selectedSvg.rot + deg) % 360;
        updateUI(); draw();
    }

    function centerSVG(axis) {
        if(!selectedSvg) return;
        if(axis === 'x' || axis === 'both') selectedSvg.x = paper.x + (paper.w - selectedSvg.w)/2;
        if(axis === 'y' || axis === 'both') selectedSvg.y = paper.y + (paper.h - selectedSvg.h)/2;
        draw();
    }

    function deleteSVG() {
        if(!selectedSvg) return;
        svgs = svgs.filter(s => s !== selectedSvg);
        if(selectedSvg === lastTracedSvg) {
            lastTracedSvg = null;
            document.getElementById('imgControls').style.display = 'none';
        }
        selectedSvg = null; updateUI(); draw();
    }

    // --- Core Data Parsing & Tracing ---
    function processSVGData(svgString, isTraced = false, keepBorder = true) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgString, "image/svg+xml");
        const parserSvg = document.getElementById('svgParser');
        parserSvg.innerHTML = ""; 

        let importedSVG = document.importNode(doc.documentElement, true);
        parserSvg.appendChild(importedSVG);

        let pathsElements = importedSVG.querySelectorAll('path, line, polyline, polygon, circle, ellipse, rect');
        let parsedPaths = [];
        let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;

        // Fetch User Resolution Quality
        let resSelect = document.getElementById('svgRes');
        let qualityRes = resSelect ? parseFloat(resSelect.value) : 2.5;

        function sampleElement(element, ctm) {
            let length = element.getTotalLength ? element.getTotalLength() : 0;
            if(length === 0) return;

            // OPTIMIZATION: Dynamically scale points based on user quality, with a hard safety cap
            let numSamples = Math.max(5, Math.ceil(length / qualityRes));
            if (numSamples > 3000) numSamples = 3000; // Hard cap prevents browser crash on huge internal coordinates

            let points = [];
            for(let i = 0; i <= numSamples; i++) {
                let pt = element.getPointAtLength(i/numSamples * length);
                
                let realX = pt.x;
                let realY = pt.y;
                
                if (ctm) {
                    let svgPt = parserSvg.createSVGPoint();
                    svgPt.x = pt.x;
                    svgPt.y = pt.y;
                    let transformed = svgPt.matrixTransform(ctm);
                    realX = transformed.x;
                    realY = transformed.y;
                }

                points.push({x: realX, y: realY});
                xMin = Math.min(xMin, realX); xMax = Math.max(xMax, realX);
                yMin = Math.min(yMin, realY); yMax = Math.max(yMax, realY);
            }
            parsedPaths.push({ points: points });
        }

        pathsElements.forEach(el => {
            let ctm = el.getCTM ? el.getCTM() : null;

            if (el.tagName.toLowerCase() === 'path') {
                let d = el.getAttribute('d');
                if (!d) return;

                let subPathStrings = d.split(/(?=[Mm])/);
                let lastPt = {x: 0, y: 0}; 
                let isFirstMove = true;

                subPathStrings.forEach((subD) => {
                    subD = subD.trim();
                    if (!subD) return;

                    let cmd = subD.charAt(0);
                    let rest = subD.substring(1).trim();

                    if (cmd === 'm' || cmd === 'M') {
                        let match = rest.match(/^([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)(?:[,\s]+|(?=[+-]))([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)(.*)/is);
                        if (match) {
                            let dx = parseFloat(match[1]);
                            let dy = parseFloat(match[2]);
                            let remaining = match[3].trim();
                            
                            if (remaining.startsWith(',')) remaining = remaining.substring(1).trim();
                            
                            let absX = (cmd === 'm' && !isFirstMove) ? lastPt.x + dx : dx;
                            let absY = (cmd === 'm' && !isFirstMove) ? lastPt.y + dy : dy;

                            if (remaining) {
                                if (/^[+-]?[\d.]/.test(remaining)) {
                                    let lineCmd = (cmd === 'm') ? 'l' : 'L';
                                    subD = `M ${absX} ${absY} ${lineCmd} ${remaining}`;
                                } else {
                                    subD = `M ${absX} ${absY} ${remaining}`;
                                }
                            } else {
                                subD = `M ${absX} ${absY}`;
                            }
                        }
                    }

                    isFirstMove = false;

                    let subEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    subEl.setAttribute('d', subD);
                    parserSvg.appendChild(subEl);
                    
                    let len = subEl.getTotalLength ? subEl.getTotalLength() : 0;
                    if (subEl.getPointAtLength) {
                        try { lastPt = subEl.getPointAtLength(len); } catch(e) {}
                    }
                    
                    sampleElement(subEl, ctm); 
                    parserSvg.removeChild(subEl);
                });
            } else {
                sampleElement(el, ctm);
            }
        });

        parserSvg.innerHTML = ""; 

        if(parsedPaths.length === 0) return null;

        if (isTraced && !keepBorder) {
            let totalW = xMax - xMin;
            let totalH = yMax - yMin;
            
            parsedPaths = parsedPaths.filter(path => {
                if (path.points.length === 0) return false;
                let pxMin = Infinity, pxMax = -Infinity, pyMin = Infinity, pyMax = -Infinity;
                path.points.forEach(pt => {
                    pxMin = Math.min(pxMin, pt.x); pxMax = Math.max(pxMax, pt.x);
                    pyMin = Math.min(pyMin, pt.y); pyMax = Math.max(pyMax, pt.y);
                });
                
                let pw = pxMax - pxMin;
                let ph = pyMax - pyMin;
                
                if (totalW > 0 && totalH > 0 && pw >= totalW * 0.95 && ph >= totalH * 0.95) {
                    return false; 
                }
                return true; 
            });

            xMin = Infinity; xMax = -Infinity; yMin = Infinity; yMax = -Infinity;
            parsedPaths.forEach(path => {
                path.points.forEach(pt => {
                    xMin = Math.min(xMin, pt.x); xMax = Math.max(xMax, pt.x);
                    yMin = Math.min(yMin, pt.y); yMax = Math.max(yMax, pt.y);
                });
            });

            if (xMin === Infinity) { xMin = 0; xMax = 10; yMin = 0; yMax = 10; }
        }

        let origW = xMax - xMin; let origH = yMax - yMin;
        let scale = Math.min((paper.w * 0.8) / origW, (paper.h * 0.8) / origH);

        let newSvg = {
            paths: parsedPaths, origW: origW, origH: origH, rawXmin: xMin, rawYmin: yMin,
            x: 0, y: 0, w: origW * scale, h: origH * scale, rot: 0
        };

        svgs.push(newSvg);
        
        if(!isTraced) {
            selectedSvg = newSvg;
            centerSVG('both'); updateUI(); draw();
        }
        return newSvg;
    }

    function handleSvgUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) { processSVGData(e.target.result); event.target.value = ""; };
        reader.readAsText(file);
    }

    // --- OPTIMIZED IMAGE TRACING SYSTEM ---
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            let img = new Image();
            img.onload = function() {
                // Pre-process: Downscale huge smartphone photos to prevent trace engine freezing
                let maxDim = 800;
                let w = img.width; let h = img.height;
                
                if (w > maxDim || h > maxDim) {
                    let ratio = Math.min(maxDim / w, maxDim / h);
                    w = Math.round(w * ratio);
                    h = Math.round(h * ratio);
                }
                
                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = w; tempCanvas.height = h;
                let tCtx = tempCanvas.getContext('2d');
                
                // Pre-process: Fill white background to prevent transparent PNGs from tracing poorly
                tCtx.fillStyle = "#ffffff"; 
                tCtx.fillRect(0, 0, w, h);
                tCtx.drawImage(img, 0, 0, w, h);
                
                lastRasterImage = tempCanvas.toDataURL('image/png');
                document.getElementById('imgControls').style.display = 'block';
                lastTracedSvg = null; 
                runImageTracer();
            };
            img.src = e.target.result;
            event.target.value = ""; 
        };
        reader.readAsDataURL(file);
    }

    function runImageTracer() {
        if(!lastRasterImage) return;
        
        let detail = parseInt(document.getElementById('traceDetail').value); 
        let ltres = 5.0 - ((detail - 1) / 99) * 4.99; 
        if(ltres < 0.01) ltres = 0.01;

        let pathomit = parseInt(document.getElementById('traceNoise').value);
        let sharpCorners = document.getElementById('traceCorners').checked;
        let keepBorder = document.getElementById('traceBorder').checked;

        const options = { 
            ltres: ltres, 
            qtres: ltres, 
            pathomit: pathomit, 
            rightangleenhance: sharpCorners,
            colorsampling: 0, 
            numberofcolors: 2, 
            mincolorratio: 0, 
            colorquantcycles: 3 
        };
        
        ImageTracer.imageToSVG(lastRasterImage, function(svgString) {
            let newSvg = processSVGData(svgString, true, keepBorder);
            if(!newSvg) { alert("Tracing failed or produced no paths."); return; }

            if(lastTracedSvg && svgs.includes(lastTracedSvg)) {
                let oldMmPerPixel = lastTracedSvg.w / lastTracedSvg.origW;
                
                newSvg.w = newSvg.origW * oldMmPerPixel;
                newSvg.h = newSvg.origH * oldMmPerPixel;
                
                let oldCx = lastTracedSvg.x + lastTracedSvg.w / 2;
                let oldCy = lastTracedSvg.y + lastTracedSvg.h / 2;
                newSvg.x = oldCx - newSvg.w / 2;
                newSvg.y = oldCy - newSvg.h / 2;
                
                newSvg.rot = lastTracedSvg.rot;
                svgs = svgs.filter(s => s !== lastTracedSvg);
            } else {
                selectedSvg = newSvg;
                centerSVG('both');
            }
            
            lastTracedSvg = newSvg;
            selectedSvg = newSvg;
            updateUI(); draw();
        }, options);
    }

    // --- G-Code Generation ---
    function generateGCode() {
        if(svgs.length === 0) { alert("Please load an object first."); return; }
        
        let isHardwareSquish = false;
        let isDrawingOnAir = false;
        
        svgs.forEach(svg => {
            let scaleX = svg.w / svg.origW; let scaleY = svg.h / svg.origH;
            let cx = svg.x + svg.w / 2; let cy = svg.y + svg.h / 2;

            svg.paths.forEach(path => {
                path.points.forEach((pt) => {
                    let inkX = svg.x + ((pt.x - svg.rawXmin) * scaleX);
                    let inkY = svg.y + svg.h - ((pt.y - svg.rawYmin) * scaleY);
                    let rotPt = rotatePoint(inkX, inkY, cx, cy, -svg.rot);

                    let checkNozX = rotPt.x - hw.offX; 
                    let checkNozY = rotPt.y + hw.offY; 

                    if(checkNozX < 0 || checkNozX > BED_W || checkNozY < 0 || checkNozY > BED_H) {
                        isHardwareSquish = true;
                    }
                    if(rotPt.x < 0 || rotPt.x > BED_W || rotPt.y < 0 || rotPt.y > BED_H) {
                        isDrawingOnAir = true;
                    }
                });
            });
        });

        if(isHardwareSquish) {
            let proceed = confirm("⚠️ WARNING: Part of your drawing is outside the red dashed safe zone!\n\nBecause the pen is offset from the nozzle, the actual printable area is smaller than the steel sheet. Anything outside the red box will be squished into a straight line.\n\nDo you want to generate the G-Code anyway?");
            if(!proceed) return;
        } else if (isDrawingOnAir) {
            let proceed = confirm("⚠️ WARNING: Pen off the edge of the bed!\n\nThe printer hardware can safely reach this area without squishing the image, but the pen itself will be literally hanging off the edge of the 250x210mm steel sheet (drawing on the air/desk).\n\nDo you want to generate the G-Code anyway?");
            if(!proceed) return;
        }

        let zDraw = hw.zCal - hw.zPres;
        let zTravel = hw.zCal + 5.0;
        let speedTravel = 6000;
        let speedDraw = 3000;

        let gcode = [
            "; --- MK4S WEB PLOTTER GCODE ---",
            "G21 ; Set units to millimeters",
            "G90 ; Use absolute coordinates",
            "M104 S0 ; Extruder off",
            "M140 S0 ; Bed off",
            "G28 ; Home axes",
            `G1 Z${zTravel.toFixed(2)} F${speedTravel}`,
            "M0 Click screen knob to begin plot ; Safety Pause",
            "M117 Plotting... Turn knob to Live-Adjust Z"
        ];

        // Draw vectors exactly as structured originally
        svgs.forEach(svg => {
            let scaleX = svg.w / svg.origW; let scaleY = svg.h / svg.origH;
            let cx = svg.x + svg.w / 2; let cy = svg.y + svg.h / 2;

            svg.paths.forEach(path => {
                if(path.points.length === 0) return;
                
                path.points.forEach((pt, i) => {
                    let inkX = svg.x + ((pt.x - svg.rawXmin) * scaleX);
                    let inkY = svg.y + svg.h - ((pt.y - svg.rawYmin) * scaleY);
                    let rotPt = rotatePoint(inkX, inkY, cx, cy, -svg.rot);

                    let nozX = rotPt.x - hw.offX; 
                    let nozY = rotPt.y + hw.offY; 

                    nozX = Math.max(0, Math.min(BED_W, nozX)); nozY = Math.max(0, Math.min(BED_H, nozY));

                    if(i === 0) {
                        gcode.push(`G1 X${nozX.toFixed(3)} Y${nozY.toFixed(3)} F${speedTravel}`);
                        gcode.push(`G1 Z${zDraw.toFixed(3)} F${speedDraw/2}`);
                        gcode.push("G4 P200 ; Settle down");
                    } else {
                        gcode.push(`G1 X${nozX.toFixed(3)} Y${nozY.toFixed(3)} F${speedDraw}`);
                    }
                });
                gcode.push("G4 P200 ; Settle before lift");
                gcode.push(`G1 Z${zTravel.toFixed(3)} F${speedTravel}`);
            });
        });

        gcode.push(`G1 Z${(zTravel + 20).toFixed(2)} F${speedTravel}`);
        gcode.push(`G1 X0 Y210 F${speedTravel}`);
        gcode.push("M84 ; Disable motors");

        let blob = new Blob([gcode.join("\n")], { type: 'text/plain' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a'); a.href = url; a.download = "plotter_web.gcode";
        a.click(); URL.revokeObjectURL(url);
    }

    updateUI();
    resizeCanvas();
</script>
